<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="620" viewBox="0 0 1400 620">
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f4b7c"/></marker>
    <style>
      .title{font-family:SimSun,"Microsoft YaHei",sans-serif;font-size:26px;font-weight:700;fill:#132238}
      .stage{font-family:SimSun,"Microsoft YaHei",sans-serif;font-size:22px;font-weight:700;fill:#132238}
      .body{font-family:SimSun,"Microsoft YaHei",sans-serif;font-size:18px;fill:#243447}
      .small{font-family:SimSun,"Microsoft YaHei",sans-serif;font-size:16px;fill:#425466}
      .box{stroke:#2f4b7c;stroke-width:2;rx:18}
      .arrow{stroke:#2f4b7c;stroke-width:3;fill:none;marker-end:url(#arrow)}
    </style>
  </defs>
  <rect width="1400" height="620" fill="#ffffff"/>
  <text x="700" y="42" text-anchor="middle" class="title">实验 1 至实验 5 数据模型应用闭环</text>
  <rect x="40" y="90" width="240" height="220" class="box" fill="#e9f2ff"/>
  <text x="160" y="128" text-anchor="middle" class="stage">实验 1 数据</text>
  <text x="70" y="170" class="body">MUGE / Amazon 数据</text>
  <text x="70" y="202" class="body">清洗与相对路径</text>
  <text x="70" y="234" class="body">9 类商品图文对</text>
  <text x="70" y="274" class="small">products.csv + 图片</text>

  <rect x="330" y="90" width="240" height="220" class="box" fill="#eef8ec"/>
  <text x="450" y="128" text-anchor="middle" class="stage">实验 2 微调</text>
  <text x="360" y="170" class="body">Chinese-CLIP LoRA</text>
  <text x="360" y="202" class="body">图文对比学习</text>
  <text x="360" y="234" class="body">epoch3.pt</text>
  <text x="360" y="274" class="small">train / valid / test</text>

  <rect x="620" y="90" width="240" height="220" class="box" fill="#fff5e8"/>
  <text x="740" y="128" text-anchor="middle" class="stage">实验 3 优化</text>
  <text x="650" y="170" class="body">ONNX FP32 / FP16</text>
  <text x="650" y="202" class="body">TensorRT 推理</text>
  <text x="650" y="234" class="body">FAISS 向量索引</text>
  <text x="650" y="274" class="small">图像 / 文本向量</text>

  <rect x="910" y="90" width="200" height="220" class="box" fill="#f4edff"/>
  <text x="1010" y="128" text-anchor="middle" class="stage">实验 4 API</text>
  <text x="940" y="170" class="body">FastAPI</text>
  <text x="940" y="202" class="body">/image /text</text>
  <text x="940" y="234" class="body">/match /admin</text>
  <text x="940" y="274" class="small">统一返回体</text>

  <rect x="1160" y="90" width="200" height="220" class="box" fill="#fff0f0"/>
  <text x="1260" y="128" text-anchor="middle" class="stage">实验 5 Agent</text>
  <text x="1190" y="170" class="body">Qwen3-4B + QLoRA</text>
  <text x="1190" y="202" class="body">LangChain 工具</text>
  <text x="1190" y="234" class="body">多轮会话</text>
  <text x="1190" y="274" class="small">/agent/chat</text>

  <path d="M280 200 L330 200" class="arrow"/>
  <path d="M570 200 L620 200" class="arrow"/>
  <path d="M860 200 L910 200" class="arrow"/>
  <path d="M1110 200 L1160 200" class="arrow"/>

  <rect x="210" y="385" width="980" height="155" rx="20" fill="#f7f9fc" stroke="#9aa9bd" stroke-width="2"/>
  <text x="700" y="425" text-anchor="middle" class="stage">关键数据流与技术复用</text>
  <text x="250" y="463" class="body">数据复用：清洗后的商品图文 → Chinese-CLIP 训练文本 → FAISS 索引 → API 返回商品事实</text>
  <text x="250" y="498" class="body">模型复用：实验 2 LoRA 经验用于 QLoRA；实验 3 量化产物用于 API；实验 4 API 封装为 Agent 工具</text>
  <path d="M160 310 C160 360 260 380 350 385" class="arrow"/>
  <path d="M450 310 C450 355 490 375 520 385" class="arrow"/>
  <path d="M740 310 C740 350 700 375 700 385" class="arrow"/>
  <path d="M1010 310 C1010 355 900 375 870 385" class="arrow"/>
  <path d="M1260 310 C1260 355 1120 375 1050 385" class="arrow"/>
</svg>
