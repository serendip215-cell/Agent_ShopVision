name: backend-tests

# 只在 webapp 相关改动时跑，纯文档推送不烧 CI 分钟
on:
  push:
    paths:
      - "webapp/**"
      - ".github/workflows/backend-tests.yml"
  pull_request:
    paths:
      - "webapp/**"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webapp/backend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: webapp/backend/requirements.txt

      - name: 安装依赖
        run: |
          pip install -r requirements.txt
          pip install black ruff mypy

      - name: 代码规范（配置见 pyproject.toml）
        run: |
          black --check .
          ruff check .
          mypy .

      - name: 后端自检
        run: python -m unittest discover -s tests -v